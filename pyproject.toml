[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthmed"
version = "0.1.0"
description = "Synthetic ResDAC / Medicare claims generator producing FTS-compliant DAT files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Pavel Belakurski" },
    { name = "Dmitry Etin" },
    { name = "Michael Bouzinier", email = "michael.bouzinier@forome.org" },
]
maintainers = [
    { name = "Forome Platform" },
]
keywords = ["medicare", "resdac", "synthetic-data", "claims", "medpar", "mbsf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "faker>=20.0",
    "zipcodes>=1.2",
    "us>=3.1",
    "addfips>=0.4",
    "dorieh",
]

[project.optional-dependencies]
plot = ["matplotlib", "geopandas"]
dev = ["jupyter", "ipykernel", "ruff", "pytest"]

[project.scripts]
synthmed = "synthmed.cli:main"

[project.urls]
Repository = "https://github.com/forome/synthetic-resdac-claims"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthmed = ["py.typed"]
